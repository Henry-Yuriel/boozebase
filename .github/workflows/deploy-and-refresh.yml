name: Booze Base Build, Weekly Price Refresh & Netlify Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Every Monday 09:00 KST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      refresh_prices:
        description: 'Run price/stock refresh before building?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh prices & stock statuses (Weekly / Manual)
        if: github.event_name == 'schedule' || inputs.refresh_prices == true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\refresh_prices.ps1 -TargetCount 2000 -SkipBuild

      - name: Commit updated liquor_data.json & thumbnails
        if: github.event_name == 'schedule' || inputs.refresh_prices == true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liquor_data.json ASSET_SOURCES.md assets/images
          $diff = git status --porcelain
          if ($diff) {
            $today = Get-Date -Format "yyyy-MM-dd"
            git commit -m "chore: weekly liquor price & stock refresh ($today)"
            git push
          } else {
            Write-Host "No price or image changes to commit."
          }

      - name: Build static site into dist/
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build_site.ps1 -SkipZip -SkipRootSync

      - name: Setup Node.js for Netlify CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy dist/ to Netlify Production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: pwsh
        run: |
          npx --yes netlify-cli deploy --prod --dir=dist --message="Auto deploy from GitHub Actions (${{ github.sha }})"

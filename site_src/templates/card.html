<article class="card" data-name="{{SEARCH}}" data-price="{{PRICE_RAW}}" data-tags="{{TAGS_RAW}}" data-order="{{ORDER}}">
  <div class="card-img"><img src="{{IMG}}" alt="{{NAME}} 병 이미지" width="300" height="300" loading="lazy" decoding="async"></div>
  <div class="card-body">
    <span class="card-cat">{{CAT_LABEL}} · {{VOL}}ml</span>
    <h3 class="card-name"><a href="{{URL}}">{{NAME}}</a></h3>
    <div class="card-tags">{{TAG_CHIPS}}</div>
    <p class="card-price">{{PRICE}}<small>확인가</small></p>
  </div>
</article>

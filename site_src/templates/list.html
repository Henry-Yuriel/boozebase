<section class="page-head">
  <div class="wrap">
    <nav class="crumb" aria-label="위치"><a href="/">홈</a><span aria-hidden="true">›</span><span>{{CRUMB}}</span></nav>
    <h1>{{EMOJI}} {{H1}}</h1>
    <p>{{INTRO}}</p>
    <nav class="subnav" aria-label="다른 목록">{{SUBNAV}}</nav>
  </div>
</section>
<section>
  <div class="wrap">
    <div class="toolbar" data-list-tools>
      <label class="toolbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr-only">목록 내 검색</span>
        <input type="search" data-list-q placeholder="이 목록에서 이름·안주 검색" autocomplete="off">
      </label>
      <select data-list-sort aria-label="정렬">
        <option value="order">추천순</option>
        <option value="price-asc">낮은 가격순</option>
        <option value="price-desc">높은 가격순</option>
      </select>
      <div class="flavor-filter" role="group" aria-label="맛 필터">{{FLAVOR_BUTTONS}}</div>
      <span class="result-count" data-list-count>{{COUNT}}개 보틀</span>
    </div>
    {{AD_LIST_TOP}}
    <div class="grid" data-list>{{CARDS}}</div>
    <p class="empty" data-list-empty hidden>조건에 맞는 보틀이 없어요. 필터를 바꿔보세요.</p>
    <div class="load-more"><button type="button" class="btn btn-ghost" data-list-more hidden>더 보기</button></div>
    {{AD_LIST_BOTTOM}}
  </div>
</section>
<section class="section">
  <div class="wrap">
    <div class="band">
      <div><h2>뭘 골라야 할지 모르겠다면</h2><p>2분 취향 테스트로 {{TOTAL}}종 중 나에게 맞는 보틀을 찾아보세요.</p></div>
      <a class="btn btn-primary" href="/test/">취향 테스트 시작 →</a>
    </div>
  </div>
</section>
